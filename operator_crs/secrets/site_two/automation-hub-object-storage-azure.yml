apiVersion: v1
kind: Secret
metadata:
  name: "{{ hub_object_storage_secret_name }}"
  namespace: "{{ namespace_site_two }}"
type: Opaque
stringData:
  azure-account-name: "{{ hub_azure_account_name }}"
  azure-account-key: "{{ hub_azure_account_key }}"
  azure-container: "{{ hub_azure_container }}"
{% if hub_azure_container_path | default('') | length > 0 %}
  azure-container-path: "{{ hub_azure_container_path }}"
{% endif %}
{% if hub_azure_connection_string | default('') | length > 0 %}
  azure-connection-string: "{{ hub_azure_connection_string }}"
{% endif %}
