apiVersion: v1
kind: Secret
metadata:
  name: "{{ hub_object_storage_secret_name }}"
  namespace: "{{ namespace_site_two }}"
type: Opaque
stringData:
  s3-access-key-id: "{{ hub_s3_access_key_id }}"
  s3-secret-access-key: "{{ hub_s3_secret_access_key }}"
  s3-bucket-name: "{{ hub_s3_bucket_name }}"
  s3-region: "{{ hub_s3_region }}"
{% if hub_s3_endpoint | default('') | length > 0 %}
  s3-endpoint: "{{ hub_s3_endpoint }}"
{% endif %}
