---
# Apply OCP monitoring manifests to one site.
# Expected vars: site_namespace, site_label, postgres_check_image, pg_check_db_host

- name: Create postgres-check-db secret
  kubernetes.core.k8s:
    state: present
    context: "{{ k8s_context | default(omit) }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-check-db
        namespace: "{{ site_namespace }}"
      stringData:
        DB_CONFIG: "{{ {'host': pg_check_db_host, 'port': (db_port | default('5432')) | int, 'dbname': db_name_controller | default('postgres'), 'user': postgres_admin_user, 'password': postgres_admin_password} | to_json }}"

- name: Create postgres-check-gateway secret
  kubernetes.core.k8s:
    state: present
    context: "{{ k8s_context | default(omit) }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-check-gateway
        namespace: "{{ site_namespace }}"
      stringData:
        GATEWAY_URL: "{{ gateway_url }}"
        GATEWAY_USER: "{{ gateway_user | default('admin') }}"
        GATEWAY_PASSWORD: "{{ gateway_password }}"
        GATEWAY_SSL_VERIFY: "{{ gateway_ssl_verify | default('true') }}"
  when: gateway_url is defined and gateway_url | length > 0

- name: Apply aap-site-metrics Deployment
  kubernetes.core.k8s:
    state: present
    apply: true
    context: "{{ k8s_context | default(omit) }}"
    definition: "{{ lookup('ansible.builtin.template', '../../files/monitoring/metrics-deployment.yml') | from_yaml }}"

- name: Apply aap-site-metrics Service
  kubernetes.core.k8s:
    state: present
    context: "{{ k8s_context | default(omit) }}"
    definition: "{{ lookup('ansible.builtin.template', '../../files/monitoring/metrics-service.yml') | from_yaml }}"

- name: Apply ServiceMonitor
  kubernetes.core.k8s:
    state: present
    context: "{{ k8s_context | default(omit) }}"
    definition: "{{ lookup('ansible.builtin.template', '../../files/monitoring/service-monitor.yml') | from_yaml }}"

- name: Apply PrometheusRule
  kubernetes.core.k8s:
    state: present
    context: "{{ k8s_context | default(omit) }}"
    definition: "{{ lookup('ansible.builtin.template', '../../files/monitoring/prometheus-rule.yml') | from_yaml }}"

- name: Grant prometheus-k8s service discovery access in site namespace
  kubernetes.core.k8s:
    state: present
    context: "{{ k8s_context | default(omit) }}"
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: prometheus-k8s-metrics-access
        namespace: "{{ site_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: view
      subjects:
        - kind: ServiceAccount
          name: prometheus-k8s
          namespace: openshift-monitoring
